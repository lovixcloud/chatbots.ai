name: chatbots.ai CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbots_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package
        run: pnpm build:shared

      - name: Generate Prisma Client & Push DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chatbots_ai
        run: |
          pnpm db:generate
          pnpm db:push
          pnpm db:seed

      - name: Run Unit Tests
        run: pnpm test

      - name: Typecheck and Build Web App & API
        run: |
          pnpm build:api
          pnpm build:web
          pnpm build:widget
